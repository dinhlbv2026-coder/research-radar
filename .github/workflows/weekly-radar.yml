name: Research Radar hằng tuần

on:
  schedule:
    - cron: "0 23 * * 0"   # 23:00 UTC Chủ nhật = 06:00 sáng thứ Hai giờ Việt Nam
  workflow_dispatch:        # nút "Run workflow" để chạy tay bất kỳ lúc nào
    inputs:
      topic:
        description: "id chủ đề (để trống = chạy tất cả)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Chạy radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python src/radar.py --topic "${{ github.event.inputs.topic }}"
          else
            python src/radar.py
          fi

      - name: Xuất PDF khổ A4
        run: |
          sudo apt-get install -y -q fonts-liberation
          python -m playwright install --with-deps chromium
          D=$(date -u +%F)
          mkdir -p reports/pdf
          python src/make_pdf.py "reports/$D.md" "reports/pdf/$D.pdf"
          cp "reports/pdf/$D.pdf" reports/latest.pdf

      - name: Lưu báo cáo vào kho
        run: |
          git config user.name  "research-radar-bot"
          git config user.email "research-radar-bot@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet || git commit -m "Radar $(date -u +%F)"
          git pull --rebase origin main
          git push
